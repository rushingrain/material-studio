name: material-studio-external

services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      APP_UPLOAD_DIR: /uploads
    # Linux 云服务器通过宿主机映射端口访问已有 MySQL 容器。
    network_mode: host
    volumes:
      - upload-data:/uploads

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  upload-data:
