server:
  port: ${SERVER_PORT:8080}

app:
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  auth:
    cookie-name: ${APP_AUTH_COOKIE_NAME:material_studio_session}
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
    session-ttl-seconds: ${APP_AUTH_SESSION_TTL_SECONDS:604800}
    password-iterations: ${APP_AUTH_PASSWORD_ITERATIONS:210000}
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}
  execution:
    core-pool-size: ${APP_TASK_CORE_POOL_SIZE:2}
    max-pool-size: ${APP_TASK_MAX_POOL_SIZE:2}
    queue-capacity: ${APP_TASK_QUEUE_CAPACITY:100}
  simulation:
    step-delay-ms: ${APP_STEP_DELAY_MS:1000}
    asset-check-delay-ms: ${APP_ASSET_CHECK_DELAY_MS:}
    simulating-delay-ms: ${APP_SIMULATING_DELAY_MS:}
    result-packaging-delay-ms: ${APP_RESULT_PACKAGING_DELAY_MS:}
    fail-stage: ${APP_FAIL_STAGE:}

spring:
  application:
    name: material-studio-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: ${APP_MAX_UPLOAD_FILE_SIZE:25MB}
      max-request-size: ${APP_MAX_UPLOAD_REQUEST_SIZE:30MB}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: cn.learn.lfy.mtr
  configuration:
    map-underscore-to-camel-case: true
