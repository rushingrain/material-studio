server:
  port: ${SERVER_PORT:8080}

app:
  upload-dir: ${APP_UPLOAD_DIR:../uploads}
  simulation:
    step-delay-ms: ${APP_STEP_DELAY_MS:1000}
    fail-stage: ${APP_FAIL_STAGE:}

spring:
  application:
    name: material-studio-backend
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: cn.learn.lfy.mtr
  configuration:
    map-underscore-to-camel-case: true